name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # The main branch ruleset requires a check with this exact name.
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # prisma.config.ts reads DATABASE_URL even for generate. The tests set
      # their own test.db URL in vitest.config.ts.
      - name: Generate Prisma client
        working-directory: server
        env:
          DATABASE_URL: file:./ci.db
        run: npx prisma generate

      - name: Typecheck server
        run: npm run typecheck -w server

      - name: Typecheck client
        run: npm run typecheck -w client

      - name: Test
        run: npm test

      - name: Build client
        run: npm run build -w client
