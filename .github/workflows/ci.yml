name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # The main branch ruleset requires a check with this exact name.
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # prisma.config.ts reads DATABASE_URL even for generate. The tests set
      # their own test.db URL in vitest.config.ts.
      - name: Generate Prisma client
        working-directory: server
        env:
          DATABASE_URL: file:./ci.db
        run: npx prisma generate

      - name: Typecheck server
        run: npm run typecheck -w server

      - name: Typecheck client
        run: npm run typecheck -w client

      # Two steps, so the failing part shows in the step list. Every test file
      # lives in tests/unit or tests/api (see the testing skill).
      - name: Unit tests
        working-directory: server
        run: npx vitest run tests/unit

      - name: API tests
        working-directory: server
        run: npx vitest run tests/api

      - name: Build client
        run: npm run build -w client

  e2e:
    # Separate from CI, so a failing browser test does not hide a failing unit
    # or API test, and the required CI check stays the same.
    name: E2E
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        env:
          DATABASE_URL: file:./ci.db
        run: npx prisma generate

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      # Playwright starts its own server (3100, e2e.db) and client (5180).
      - name: E2E tests
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
